<ui:composition
     xmlns="http://www.w3.org/1999/xhtml"
   xmlns:d="http://java.debooy.eu/jsf/facelets"
   xmlns:f="http://xmlns.jcp.org/jsf/core"
   xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  template="/WEB-INF/templates/template.xhtml">
  <ui:define name="body">
    <div class="columns is-centered content">
      <div class="column is-8">
        <h:form id="formTaxonbeschrijving">
          <d:titel titel="#{natuurTaxonbeschrijving.subTitel} #{natuurTaxon.getTaxonnaam(natuur.gebruikersTaalInIso6392t)}" />

          <div class="columns is-centered">
            <div class="column">
              <div class="field is-horizontal">
                <div class="field-body is-normal">
                  <d:listbox id="beschrijvingtype" value="#{natuurTaxonbeschrijving.taxonbeschrijving.beschrijvingtype}" readonly="#{natuurTaxonbeschrijving.aktie.readonly}" items="#{natuurTaxonbeschrijving.selectBeschrijvingtypes}" textvalue="#{natuurTaxonbeschrijving.beschrijvingtype}" fullwidth="true" required="true" />
                </div>
              </div>
              <div class="field is-horizontal">
                <div class="field-body is-normal">
                  <d:inputTextarea id="beschrijving" value="#{natuurTaxonbeschrijving.taxonbeschrijving.beschrijving}" cols="100" rows="#{properties.appValue('natuur.pagelength')}" readonly="#{natuurTaxonbeschrijving.aktie.readonly}" />
                </div>
              </div>
            </div>
          </div>

          <d:crudbuttonbar bean="#{natuurTaxonbeschrijving}" form="formTaxonbeschrijving" returnto="#{natuur.path}#{natuurTaxonbeschrijving.returnTo}" />
        </h:form>
      </div>
    </div>
  </ui:define>
  <ui:define name="modal">
    <d:confirmatie titel="#{i18nTeksten.tekst('natuur.titel.taxonbeschrijving.delete')} #{natuurTaxon.getTaxonnaam(natuur.gebruikersTaalInIso6392t)}" />
  </ui:define>
</ui:composition>
