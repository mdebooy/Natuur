<ui:composition
     xmlns="http://www.w3.org/1999/xhtml"
   xmlns:d="http://java.debooy.eu/jsf/facelets"
   xmlns:f="http://xmlns.jcp.org/jsf/core"
   xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  template="/WEB-INF/templates/template.xhtml">
  <ui:define name="body">
    <div class="columns is-centered content">
      <div class="column is-8">
        <h:form id="formTaxonnaam">
          <d:titel titel="#{natuurTaxon.detailSubTitel}" />

          <div class="columns is-centered">
            <div class="column">
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.taal')}" />
                <div class="field-body is-normal">
                  <d:listbox id="taal" value="#{natuurTaxon.taxonnaam.taal}" fullwidth="true" required="true" readonly="#{!natuurTaxon.detailAktie.nieuw}" items="#{doosRemote.talenIso6392t}" textvalue="#{doosRemote.taalIso6392t(natuurTaxon.taxonnaam.taal)}" />
                </div>
              </div>
              <div class="field is-horizontal">
                <d:label label="#{i18nTeksten.tekst('label.naam')}" />
                <div class="field-body is-normal">
                  <d:inputText id="naam" value="#{natuurTaxon.taxonnaam.naam}" maxlength="255" size="100" required="true" readonly="#{natuurTaxon.detailAktie.readonly}" />
                </div>
              </div>
            </div>
          </div>

          <d:crudbuttonbar bean="#{natuurTaxon}" form="formTaxonnaam" detail="detail" returnto="#{natuur.path}#{natuurTaxon.returnTo}" />
        </h:form>
      </div>
    </div>
  </ui:define>
  <ui:define name="modal">
    <d:confirmatie titel="#{natuurTaxon.detailDeletetitel}" />
  </ui:define>
</ui:composition>
