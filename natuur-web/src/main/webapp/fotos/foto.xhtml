<ui:composition
     xmlns="http://www.w3.org/1999/xhtml"
   xmlns:d="http://java.debooy.eu/jsf/facelets"
   xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  template="/WEB-INF/templates/template.xhtml">
  <ui:define name="body">
    <div class="columns is-centered content">
      <div class="column is-8">
        <h:form id="formFoto">
          <d:titel titel="#{natuurFoto.subTitel}" />

          <div class="columns is-centered">
            <div class="column">
              <div class="field is-horizontal">
                <div class="field-label is-normal">
                  <label class="label">#{i18nTeksten.tekst('label.soort')}</label>
                </div>
                <div class="field-body is-normal">
                  <div class="field">
                    <div class="control">
                      <d:inputText id="taxon" value="#{natuurFoto.waarneming.taxon.naam}" required="true" maxlength="255" size="100" readonly="true" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="field is-horizontal">
                <div class="field-label is-normal">
                  <label class="label">#{i18nTeksten.tekst('label.gezien.op')}</label>
                </div>
                <div class="field-body is-normal">
                  <div class="field">
                    <div class="control">
                      <d:datum id="datum" value="#{natuurFoto.waarneming.datum}" required="true" readonly="true" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="field is-horizontal">
                <div class="field-label is-normal">
                  <label class="label">#{i18nTeksten.tekst('label.gebied')}</label>
                </div>
                <div class="field-body is-normal">
                  <div class="field">
                    <div class="control">
                      <d:inputText id="gebied" value="#{natuurFoto.waarneming.gebied.naam}" required="true" maxlength="255" size="100" readonly="true" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="field is-horizontal">
                <div class="field-label is-normal">
                  <label class="label">#{i18nTeksten.tekst('label.seq')}</label>
                </div>
                <div class="field-body is-normal">
                  <div class="field">
                    <div class="control">
                      <d:inputText id="taxonSeq" value="#{natuurFoto.foto.taxonSeq}" required="true" maxlength="3" size="3" readonly="#{natuurFoto.aktie.readonly}" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="field is-horizontal">
                <div class="field-label is-normal">
                  <label class="label">#{i18nTeksten.tekst('label.fotodetail')}</label>
                </div>
                <div class="field-body is-normal">
                  <div class="field">
                    <div class="control">
                      <d:inputText id="fotodetail" value="#{natuurFoto.foto.fotoDetail}" maxlength="20" size="20" readonly="#{natuurFoto.aktie.readonly}" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="field is-horizontal">
                <div class="field-label is-normal">
                  <label class="label">#{i18nTeksten.tekst('label.fotobestand')}</label>
                </div>
                <div class="field-body is-normal">
                  <div class="field">
                    <div class="control">
                      <d:inputText id="fotobestand" value="#{natuurFoto.foto.fotoBestand}" maxlength="255" size="100" readonly="#{natuurFoto.aktie.readonly}" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="field is-horizontal">
                <div class="field-label is-normal">
                  <label class="label">#{i18nTeksten.tekst('label.opmerking')}</label>
                </div>
                <div class="field-body is-normal">
                  <div class="field">
                    <div class="control">
                      <d:inputTextarea id="opmerking" value="#{natuurFoto.foto.opmerking}" readonly="#{natuurFoto.aktie.readonly}" />
                    </div>
                  </div>
                </div>
              </div>

              <d:crudbuttonbar bean="#{natuurFoto}" form="formFoto" returnto="#{natuur.path}#{natuurFoto.returnTo}" />
            </div>
          </div>
        </h:form>
      </div>
    </div>
  </ui:define>
  <ui:define name="modal">
    <d:confirmatie titel="#{natuurFoto.detailDeletetitel}" />
  </ui:define>
</ui:composition>
